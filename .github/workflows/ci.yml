name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  unit:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI import and help
        run: python prooffrontier_cli.py --help
      - name: JavaScript syntax and stale-race DOM test
        run: |
          node --check ui/app.js
          node tests/test_stale_race.js
      - name: Release hygiene
        run: python scripts/check_release.py

  lean:
    name: Lean node-probe smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: false
      - name: Toolchain
        run: lean --version
      - name: End-to-end verification
        run: python scripts/smoke_test.py
      - name: Adversarial result-channel verification
        run: python scripts/adversarial_test.py
